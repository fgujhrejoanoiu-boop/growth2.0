name: Notify on failure

on:
  workflow_run:
    workflows:
      [
        CI,
        Find feature flag code references,
        Deploy Branch to Docker Hub,
        Deploy,
        Docs,
        PR Preview Environment,
        Release,
        Rollback to SHA,
        Backfill image,
      ]
    types: [completed]

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  notify-not-success:
    runs-on: ubuntu-latest
    # SLACK_WEBHOOK_URL only exists in this repo; Release runs on a tag, not main.
    if: ${{ github.repository == 'growthbook/growthbook' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && (github.event.workflow_run.head_branch == 'main' || (github.event.workflow_run.name == 'Release' && github.event.workflow_run.event == 'push')) }}
    steps:
      - name: Send GitHub Action data to a Slack workflow
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          payload-delimiter: "_"
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            workflow_name: "${{ github.event.workflow_run.name }}"
            workflow_url: "${{ github.event.workflow_run.html_url }}"
