name: Helm Chart
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and maybe publish Helm Chart to OCI registry"
        required: false
        default: false
        type: boolean

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  build-chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/growthbook
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Rebuild helm dependencies
        run: helm dependency build
      - name: Lint helm chart
        run: helm lint --strict --with-subcharts .
      - name: Package helm chart
        run: helm package .
      - name: Login to OCI registry
        if: ${{ github.repository == 'growthbook/growthbook' && (startsWith(github.ref, 'refs/tags/') || inputs.publish) }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push helm chart to OCI registry
        if: ${{ github.repository == 'growthbook/growthbook' && (startsWith(github.ref, 'refs/tags/') || inputs.publish) }}
        run: |
          for chart in *.tgz; do
              helm push "$chart" oci://ghcr.io/growthbook/charts
          done
